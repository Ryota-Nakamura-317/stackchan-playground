; experiments/claude-code-notifier 専用 PlatformIO 設定
; 対象ハード: M5Stack 公式 Stack-Chan K151系(CoreS3 / ESP32-S3 ベース)
; 使い方:
;   cd experiments/claude-code-notifier
;   pio run -t upload -t monitor

[platformio]
default_envs = m5stack-cores3
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib

[env:m5stack-cores3]
platform = espressif32@^6.7.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
monitor_filters = esp32_exception_decoder, time
board_build.partitions = default_16MB.csv
lib_ldf_mode = deep+
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    ; StackChan-BSP の smooth_ui_toolkit (uitk) が C++14 以降の auto 戻り値を
    ; 使うため、デフォルト C++11 から底上げする。
    -std=gnu++17
    ; BSP の SCSerial.cpp は ESP-IDF v5 の UART_SCLK_DEFAULT を使うが、
    ; Arduino-ESP32 2.x (ESP-IDF v4) には未定義。APB クロックに揃える。
    -DUART_SCLK_DEFAULT=UART_SCLK_APB
build_unflags =
    -std=gnu++11
; AquesTalk ESP32 CoreS3 用 libaquestalk.a を SCons LIBS に直接追加するためのフック
; (build_flags の -l: 指定だと PlatformIO が .a 拡張子を剥がしてリンク失敗するため)
extra_scripts = pre:scripts/link_aquestalk.py
lib_deps =
    m5stack/M5Unified@^0.2.2
    meganetaaan/M5Stack-Avatar@^0.10.0
    bblanchon/ArduinoJson@^7
    ; Stack-Chan K151 (CoreS3) 公式 BSP。M5StackChan.begin() で PY32 経由のサーボ
    ; 電源 ON + SCS バス init を一括して行ってくれる。
    ; https://github.com/m5stack/StackChan-BSP
    https://github.com/m5stack/StackChan-BSP.git#1.1.0
; 本ファームでは使わない BSP の transitive 依存をリンクから外す
; (NFC / IRremote / M5HAL / M5UnitUnified は examples 用)
lib_ignore =
    M5Unit-NFC
    M5HAL
    M5UnitUnified
    IRremoteESP8266
    ; AquesTalk ESP32 Ver.2.4.2 以降(2024/10 で ESP32-S3 正式対応)を
    ; https://www.a-quest.com/download.html から入手し、
    ; firmware/lib/AquesTalkTTS/ に手動配置する。
    ; 詳細は firmware/lib/AquesTalkTTS/README.md を参照。
