; experiments/claude-code-notifier 専用 PlatformIO 設定
; 使い方:
;   cd experiments/claude-code-notifier
;   pio run -t upload -t monitor

[platformio]
default_envs = m5stack-core2
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib

[env:m5stack-core2]
platform = espressif32@^6.7.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
board_build.partitions = default_16MB.csv
lib_ldf_mode = deep+
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    m5stack/M5Unified@^0.2.2
    meganetaaan/stackchan-arduino@^0.0.5
    bblanchon/ArduinoJson@^7
    ; AquesTalk ESP32 は PlatformIO レジストリにも GitHub にも公式配布されていない。
    ; https://www.a-quest.com/download.html から ZIP を入手し、
    ; firmware/lib/AquesTalkTTS/ に手動配置する。
    ; 詳細は firmware/lib/AquesTalkTTS/README.md を参照。
