; experiments/claude-code-notifier 専用 PlatformIO 設定
; 使い方:
;   cd experiments/claude-code-notifier
;   pio run -t upload -t monitor

[platformio]
default_envs = m5stack-core2
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib

[env:m5stack-core2]
platform = espressif32@^6.7.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
board_build.partitions = default_16MB.csv
lib_ldf_mode = deep+
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    m5stack/M5Unified@^0.2.2
    meganetaaan/stackchan-arduino@^0.0.5
    bblanchon/ArduinoJson@^7
    ; AquesTalkTTS-esp32 は PlatformIO レジストリに登録されていない。
    ; 第一候補: 公式 / ミラーの Git URL を直接指定する（解決できれば自動 clone）。
    ;   https://github.com/m5stack/AquesTalkTTS-esp32.git
    ; 第二候補（推奨フォールバック）: AquesTalk 公式 https://www.a-quest.com/products/aquestalk_picoesp32.html から
    ;   ヘッダと static library を入手し firmware/lib/AquesTalkTTS/ に手動配置する。
    ;   配置構造例:
    ;     firmware/lib/AquesTalkTTS/src/AquesTalkTTS.h
    ;     firmware/lib/AquesTalkTTS/src/libAquesTalkTTSEsp32.a
